name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.bat
      - name: Smoke test
        shell: pwsh
        run: ./output/SyncTool.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: output/SyncTool.exe
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (static)
        run: |
          chmod +x build.sh
          STATIC=1 ./build.sh
          strip output/SyncTool || true
      - name: Smoke test
        run: ./output/SyncTool --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: output/SyncTool
          if-no-files-found: error

  macos-x64:
    name: macOS x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Smoke test
        run: ./output/SyncTool --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: output/SyncTool
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Smoke test
        run: ./output/SyncTool --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: output/SyncTool
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package assets
        env:
          VER: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VER#v}"
          mkdir -p out
          cp dist/windows/SyncTool.exe "out/synctool-${V}-win64.exe"
          cp dist/linux/SyncTool "out/synctool-${V}-linux_x86_64"
          cp dist/macos-x64/SyncTool "out/synctool-${V}-macos_x86_64"
          cp dist/macos-arm64/SyncTool "out/synctool-${V}-macos_arm64"
          tar -czf "out/synctool-${V}-linux_x86_64.tar.gz" -C dist/linux SyncTool
          tar -czf "out/synctool-${V}-macos_x86_64.tar.gz" -C dist/macos-x64 SyncTool
          tar -czf "out/synctool-${V}-macos_arm64.tar.gz" -C dist/macos-arm64 SyncTool
          ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
